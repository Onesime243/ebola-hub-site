<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebola, zone de santé</title>
<script>try { var t = localStorage.getItem("zs-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="province.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">EO</div><div><b>Ebola Outbreak</b><small id="brand-sub">Outil de la zone de santé</small></div></div>
    <nav id="nav"></nav>
    <div class="side-status" id="side-status"></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="flex" style="gap:12px;flex-wrap:nowrap">
        <button class="btn menu-toggle" id="menu" aria-label="Menu">☰</button>
        <div><h1 id="title">Vue générale</h1><div class="sub" id="subtitle"></div></div>
      </div>
      <div class="controls">
        <button class="btn primary" data-go="fichiers">⤒ Charger les données</button>
        <label class="field">Aire de santé<select id="aire-select" aria-label="Aire de santé"></select></label>
        <button class="btn" id="theme" title="Mode clair / sombre" aria-label="Mode clair ou sombre">◐</button>
        <div class="rel" id="user"></div>
      </div>
    </header>
    <section class="periodbar" id="periodbar"></section>
    <main id="main"></main>
    <footer class="foot"><span id="foot-l"></span><span>Pseudonymisé : identifiants et initiales uniquement · listes nominatives réservées à la province et à la zone</span></footer>
  </div>
</div>
<script src="presentation.js"></script>
<script src="en_ligne.js" data-page="zs"></script>
</body>
</html>

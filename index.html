<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ebola Outbreak Analytics Hub</title>
  <meta name="description" content="Ebola Outbreak Analytics Hub — surveillance, suivi des contacts, parcours des cas, chaînes de transmission et qualité des données">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("hub-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">EO</div><div><b>Ebola Outbreak</b><small>Analytics Hub · UMIE–INRB</small></div></div>
      <nav id="navigation" aria-label="Navigation"></nav>
      <div class="side-status"><b><span class="pulse"></span><span data-i18n>Données opérationnelles</span></b><span id="side-date"></span></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="flex" style="flex-wrap:nowrap">
          <button class="btn menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
          <div><h1 id="page-title">Vue générale</h1><div class="sub" id="page-sub"></div></div>
        </div>
        <div class="controls">
          <button class="btn primary" id="up-btn" type="button" title="Charger de nouveaux fichiers"><span data-i18n>⤒ Charger les données</span></button>
          <label class="field"><span data-i18n>Province</span><select id="province-filter"></select></label>
          <button class="btn" id="lang-toggle" type="button" title="Français / English">EN</button>
          <button class="btn" id="theme-toggle" type="button" title="Thème clair / sombre">☾</button>
        </div>
      </header>
      <div class="periodbar" id="periodbar"></div>
      <section id="content"></section>
      <footer class="foot"><span>© 2026 Onesime Mbulayi &amp; Team Data UMIE–INRB</span><span id="privacy"></span><span id="generated"></span></footer>
    </main>
  </div>
  <script src="site-config.js"></script>
  <script>
    /* Données : période choisie (?p=AAAA-MM-JJ_AAAA-MM-JJ, interface locale) ou jeu complet */
    (function () {
      var m = /[?&]p=(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/.exec(location.search);
      if (!m) return;
      var S = window.HUB_STATIC, key = m[1] + "_" + m[2];
      if (S && S.periodes && S.periodes.some(function (x) { return x.cle === key; })) document.write('<script src="periodes/' + key + '.js"><\/script>');
      else if (!S && location.protocol.indexOf("http") === 0) document.write('<script src="/api/periode/data.js?d=' + m[1] + '&f=' + m[2] + '"><\/script>');
    })();
  </script>
  <script>if (!window.DASHBOARD_DATA) document.write('<script src="dashboard-data.js"><\/script>');</script>
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
  <div class="overlay hide" id="pb-overlay"><div class="overlay-card"><div class="spinner"></div><h3 id="pb-ov-title">Recalcul de la période…</h3><div class="muted small" id="pb-ov-sub"></div><pre class="logbox" id="pb-ov-log"></pre><button class="btn" id="pb-ov-close" type="button">Fermer</button></div></div>
</body>
</html>
